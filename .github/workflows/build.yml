name: Build APK

# Builds only when you start it by hand (Actions > Build APK > Run workflow).
# This saves the free GitHub Actions minutes, which were running out because every push started a build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Create Dummy google-services.json with correct package name
      run: |
        if [ ! -f "app/google-services.json" ]; then
          echo '{"project_info":{"project_number":"000000000000","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.aistudio.photovault.kxqzvp"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
        fi

    - name: Restore signing key from GitHub Secret
      env:
        DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_B64" ]; then
          echo "The secret DEBUG_KEYSTORE_B64 is missing. Add it in Settings > Secrets and variables > Actions."
          exit 1
        fi
        echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK
      run: gradle assembleRelease -x test -x lint -Djava.awt.headless=true

    - name: Publish APK to a private release (does not use artifact storage)
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release delete latest-apk --yes --cleanup-tag || true
        gh release create latest-apk app/build/outputs/apk/release/*.apk --title "Latest APK" --notes "Newest release build" --prerelease
